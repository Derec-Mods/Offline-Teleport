name: OfflineTeleport
version: '${version}'
main: io.github.derexxd.offlineTeleport.OfflineTeleport
api-version: '1.20.4'
prefix: DerexXD
authors: [ DerexXD ]
description: Admin utility to teleport offline players
website: https://www.derekchen.dev/

commands:
  offlinetp:
    description: Teleport offline player or to offline player
    aliases: [otp, offlineteleport]
    usage: /<command> [target] [otherTarget|x y z]

permissions:
  offlinetp.offlinetp:
    description: to use /offlinetp
    default: op
  offlinetp.to-player:
    description: use /offlinetp only for teleportation to player
    default: op
  offlinetp.player-to-player:
    description: use /offlinetp only for player teleportation to player
    default: op
